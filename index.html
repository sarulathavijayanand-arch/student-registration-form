<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Student Registration</h1>
        <p class="subtitle">Enter your details to register</p>

        <form id="studentForm" novalidate>
            <div class="form-grid">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="First name">
                    <small id="firstNameError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Last name">
                    <small id="lastNameError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                    <small id="dobError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="">Select gender</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                    <small id="genderError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Contact Number</label>
                    <input type="tel" id="phone" maxlength="10"
                        placeholder="10-digit mobile number">
                    <small id="phoneError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="text" id="email" placeholder="Enter email">
                    <small id="emailError" class="error"></small>
                </div>

                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <textarea id="address" placeholder="Enter your address"></textarea>
                    <small id="addressError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                        placeholder="Minimum 6 characters">
                    <small id="passwordError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course">
                        <option value="">Select course</option>
                        <option value="Full Stack Development">Full Stack Development</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Java Programming">Java Programming</option>
                        <option value="Python Programming">Python Programming</option>
                        <option value="Data Analytics">Data Analytics</option>
                    </select>
                    <small id="courseError" class="error"></small>
                </div>

            </div>

            <div class="button-group">
                <button type="submit" id="registerBtn" disabled>
                    Register
                </button>

                <button type="button" id="resetBtn" class="reset-btn">
                    Reset
                </button>
            </div>

            <p id="successMessage"></p>
        </form>
    </div>

    <div class="container list-container">
        <h2>Registered Students</h2>
        <p id="emptyMessage">No students registered yet.</p>

        <div class="table-wrapper">
            <table id="studentTable" hidden>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Date of Birth</th>
                        <th>Gender</th>
                        <th>Contact</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th>Course</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </div>
    </div>

</body>
</html>
